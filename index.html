<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile Detectives — A1+</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--blue:#4169e1;--light:#e9efff;--purple:#7657c8;--green:#3d8b70;--red:#c96959;--line:#dfe5ef}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f3f6fc,#f8f6fb);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}
.app{max-width:1050px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;margin-bottom:14px}.logo{font-weight:800;letter-spacing:.1em;color:var(--blue)}.step{color:var(--muted);font-size:13px}
.progress{height:7px;background:#e4e9f2;border-radius:9px;overflow:hidden;margin-bottom:24px}.progress div{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:.3s}
main{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 12px 32px #23304b12}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--purple);font-weight:800}
h1{font-size:42px;line-height:1.05;margin:9px 0 12px}h2{font-size:30px;margin:8px 0 12px}h3{margin:0 0 8px}p{line-height:1.55}.lead{font-size:18px;color:#4f5b6c}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0}.three{grid-template-columns:repeat(3,1fr)}
.card,.profile{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.profile{background:#fbfcff}.avatar{font-size:28px}
.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:13px;border-radius:12px;cursor:pointer;margin:6px 0;font:inherit}.choice:hover{border-color:#9eadd7}.correct{border:2px solid var(--green)!important;background:#eff9f4!important}.wrong{border:2px solid var(--red)!important;background:#fff2ef!important}
.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e9edf5;color:var(--ink)}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}.feedback,.callout{padding:15px;border-radius:14px;margin-top:14px}.feedback{background:#f1f5fb;border-left:4px solid var(--blue)}.callout{background:#f8f4ea;border:1px solid #eadfc7}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}textarea{min-height:110px}.audio{background:#f4f1fb;border:1px solid #e4dcf4;border-radius:17px;padding:18px;margin:18px 0}audio{width:100%;margin-top:10px}.small{font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stepcard{border:1px solid var(--line);border-radius:15px;padding:16px}.badge{display:inline-block;padding:4px 8px;background:var(--light);color:#3657b4;border-radius:99px;font-size:12px;margin:2px}
@media(max-width:760px){main{padding:22px}.grid,.three,.steps{grid-template-columns:1fr}h1{font-size:34px}}
</style>
</head>
<body><div class="app">
<header><div class="logo">PERSONAL PROFILES</div><div class="step" id="step"></div></header>
<div class="progress"><div id="bar" style="width:8%"></div></div><main id="screen"></main>
</div>
<script>
let score=0;
const P=[
{name:"Joshua Bates",emoji:"👦",age:16,from:"Toronto, Canada",address:"33 Salvador Street",email:"Josh_Bates@yahoo.ca",phone:"5511478851"},
{name:"Sofia Martinez",emoji:"👩",age:17,from:"Cali, Colombia",address:"18 Green Avenue",email:"sofia.martinez@mail.com",phone:"3105552048"},
{name:"Daniel Kim",emoji:"👦",age:15,from:"Seoul, South Korea",address:"72 River Road",email:"daniel.kim@mail.com",phone:"3155557812"}];
function show(x,n){document.getElementById("screen").innerHTML=x;document.getElementById("step").textContent=n?`Part ${n} of 7`:"Ready to start";document.getElementById("bar").style.width=(n?Math.min(n,7)/7*100:8)+"%"}
function home(){score=0;show(`<div class="kicker">A1+ • Personal information</div><h1>Profile Detectives</h1><p class="lead">Read profiles, practice questions, listen, dictate and interview your classmates.</p><div class="grid three"><div class="card"><h3>📖 Read</h3><p>Find personal information in profiles.</p></div><div class="card"><h3>❓ Ask</h3><p>Practice <b>Wh-</b> and <b>Yes/No</b> questions.</p></div><div class="card"><h3>🎤 Interview</h3><p>Use your questions with a classmate.</p></div></div><div class="callout"><b>Mission:</b> Don't only find the answer. Think: <i>What question do I need?</i></div><div class="actions"><button class="btn primary" onclick="read()">Start →</button></div>`,0)}
function read(){show(`<div class="kicker">Part 1 • Read & Find</div><h2>Meet the profiles</h2><p>Read the profiles. Then answer the question.</p><div class="grid">${P.map(p=>`<div class="profile"><div class="avatar">${p.emoji} <b>${p.name}</b></div><span class="badge">${p.age} years old</span><span class="badge">${p.from}</span><p><b>Address:</b> ${p.address}<br><b>E-mail:</b> ${p.email}<br><b>Cell:</b> ${p.phone}</p></div>`).join("")}</div><div class="card"><b>Who is 15 years old?</b>${P.map((p,i)=>`<button class="choice" onclick="pick(this,${p.age===15},'r')">${p.name}</button>`).join("")}<div id="r"></div></div><div class="actions"><button class="btn primary" onclick="wh()">Next →</button></div>`,1)}
function pick(el,ok,id){el.parentElement.querySelectorAll(".choice").forEach(x=>x.classList.remove("correct","wrong"));el.classList.add(ok?"correct":"wrong");if(ok)score++;document.getElementById(id).innerHTML=`<div class="feedback">${ok?"Correct!":"Look again."}</div>`}
const Q=["What’s his name?","Where is he from?","How old is he?","What’s his address?","What’s his e-mail address?","What’s his cell phone number?"];
function wh(){let answers=["Joshua Bates","Toronto, Canada","16 years old","33 Salvador Street","Josh_Bates@yahoo.ca","5511478851"];show(`<div class="kicker">Part 2 • Read → Question</div><h2>What question finds the answer?</h2><p>Choose the best question for each answer.</p>${answers.map((a,i)=>`<div class="card" style="margin:10px 0"><b>Answer:</b> ${a}${Q.map((q,j)=>`<button class="choice" onclick="pick(this,${i===j},'q${i}')">${q}</button>`).join("")}<div id="q${i}"></div></div>`).join("")}<div class="actions"><button class="btn primary" onclick="builder()">Next →</button></div>`,2)}
function builder(){show(`<div class="kicker">Part 3 • Build the Questions</div><h2>Question Builder</h2><p>Complete the question starters.</p><div class="grid"><div class="card"><b>Toronto, Canada</b><input id="a1" placeholder="_____ is he from?"></div><div class="card"><b>16 years old</b><input id="a2" placeholder="_____ old is he?"></div><div class="card"><b>33 Salvador Street</b><input id="a3" placeholder="_____ his address?"></div><div class="card"><b>Josh_Bates@yahoo.ca</b><input id="a4" placeholder="_____ his e-mail address?"></div></div><div class="feedback"><b>Remember:</b> In these Wh- questions, the question word comes before <b>be</b>.</div><div id="bf"></div><div class="actions"><button class="btn primary" onclick="checkB()">Check →</button></div>`,3)}
function checkB(){let want=["where","how","what","what"],ok=0;want.forEach((w,i)=>{let e=document.getElementById("a"+(i+1));let good=e.value.trim().toLowerCase().startsWith(w);e.style.borderColor=good?"#3d8b70":"#c96959";if(good)ok++});score+=ok;bf.innerHTML=`<div class="feedback">You got <b>${ok}/4</b>. Now say the complete questions aloud with a partner.</div><div class="actions"><button class="btn primary" onclick="yesno()">Next →</button></div>`}
function yesno(){let items=[["Joshua is from Toronto.","Is Joshua from Toronto?"],["Joshua is 15 years old.","Is Joshua 16 years old?"],["His address is 33 Salvador Street.","Is his address 33 Salvador Street?"],["His e-mail is josh@gmail.com.","Is his e-mail josh@gmail.com?"]];show(`<div class="kicker">Part 4 • Yes / No</div><h2>Question Detective</h2><p>Choose the correct Yes/No question for each statement.</p>${items.map((x,i)=>`<div class="card" style="margin:10px 0"><b>${x[0]}</b><button class="choice" onclick="pick(this,${i!==1},'y${i}')">${x[1]}</button><button class="choice" onclick="pick(this,false,'y${i}')">${i===1?"Is Joshua 15 years old?":"Are Joshua from Toronto?"}</button><div id="y${i}"></div></div>`).join("")}<div class="feedback"><b>Notice:</b> Yes/No questions move <b>am / is / are</b> before the subject.</div><div class="actions"><button class="btn primary" onclick="dictate()">Next →</button></div>`,4)}
function dictate(){show(`<div class="kicker">Part 5 • Dictation Lab</div><h2>Listen, Dictate, Ask</h2><p>Work in pairs. A reads. B writes. Then B asks questions. Switch roles.</p><div class="grid"><div class="card"><h3>🗣️ Student A</h3><div class="callout">My name is Lucas. I’m 16 years old. I’m from Bogotá, Colombia. My address is 24 Blue Street. My e-mail is lucas.park@mail.com. My cell phone number is 3205551842.</div><p class="small">Read twice. Don't show the paragraph.</p></div><div class="card"><h3>✍️ Student B</h3><textarea placeholder="Write what you hear..."></textarea></div></div><div class="card"><h3>Question challenge</h3><p>Write 2 Wh- questions and 2 Yes/No questions about Lucas.</p><div class="grid"><input placeholder="Wh- question 1"><input placeholder="Wh- question 2"><input placeholder="Yes/No question 1"><input placeholder="Yes/No question 2"></div></div><div class="callout"><b>Teacher answer:</b> Lucas is 16, from Bogotá, Colombia. His address is 24 Blue Street. His e-mail is lucas.park@mail.com. His cell phone number is 3205551842.</div><div class="actions"><button class="btn primary" onclick="audio()">Next →</button></div>`,5)}
function audio(){show(`<div class="kicker">Part 6 • Listening</div><h2>Joshua’s Conversation</h2><p>Listen once for the general information. Listen again and answer the questions.</p><div class="audio"><b>🎧 Play the audio</b><audio controls preload="metadata" src="https://portalacademico.cch.unam.mx/sites/default/files/I1U1OA4-119.mp3"></audio><p class="small">Internet connection required for the audio.</p></div><div class="card"><h3>Round 1 — Information questions</h3>${Q.map((q,i)=>`<div style="margin:10px 0"><b>${i+1}. ${q}</b><input placeholder="Your answer"></div>`).join("")}</div><div class="card" style="margin-top:15px"><h3>Round 2 — Find the Yes/No questions</h3><p>Write the Yes/No questions you hear.</p><textarea placeholder="1. __________________________&#10;2. __________________________&#10;3. __________________________"></textarea></div><div class="feedback"><b>Challenge:</b> Which question is answered with <i>“No, I’m not”</i>? What information do you learn from that answer?</div><div class="actions"><button class="btn primary" onclick="interview()">Final mission →</button></div>`,6)}
function interview(){show(`<div class="kicker">Part 7 • Final Mission</div><h2>Become the interviewer</h2><p class="lead">Interview a classmate and create a mini personal profile.</p><div class="steps"><div class="stepcard"><b>Prepare</b><p>Write 3 Wh- questions and 3 Yes/No questions.</p></div><div class="stepcard"><b>Interview</b><p>Ask, listen and write the answers.</p></div><div class="stepcard"><b>Report</b><p>Tell another pair about your classmate.</p></div></div><div class="card" style="margin-top:18px"><h3>My questions</h3><div class="grid"><input placeholder="Wh- question 1"><input placeholder="Wh- question 2"><input placeholder="Wh- question 3"><input placeholder="Yes/No question 1"><input placeholder="Yes/No question 2"><input placeholder="Yes/No question 3"></div></div><div class="callout"><b>Useful language:</b><br>What’s your name? • Where are you from? • How old are you? • What’s your address? • What’s your e-mail address? • What’s your cell phone number?<br><br><b>Yes/No:</b> Are you…? • Is your…?<br><br><b>Report:</b> “This is ___. He/She is ___ years old. He/She is from ___. His/Her e-mail is ___.”</div><div class="actions"><button class="btn secondary" onclick="home()">Restart</button></div>`,7)}
home();
</script></body></html>
